faq:                           # [ES] D-346: ❓ /d69 (content/faq.yaml)
  d69:
    q: "🔑 ¿Cómo doy permisos en mi campamento?"
    a: "Solo el fundador da permisos, a los miembros de su campamento: en 🛡️ Gremio → 👥 Miembros → 👔 Encargados (solo lo ve el fundador; también /encargados) toca el código de un tipo de permiso (/en1 a /en4) y sale la lista de miembros: con el código de cada uno (/em1) se lo das, y el mismo código se lo quita. Son cuatro: 🏗️ Construcción (activar obras, elegir qué se construye y hacia dónde crece el territorio), ⚒️ Oficios (usar el 💰 fondo para oficios con los oficios que elijas, también 🔒 cerrado), ⚔️ Armería y fondo (tomar de la ⚔️ Armería cuando la cierras y sacar del 💰 fondo con /fs07 lo que sobra después de las obras) y 👥 Gente y chat (aceptar e invitar gente y mandar 📣 anuncios, que quedan {announce_days} días arriba en 🛡️ Gremio). Tus 🤝 asistentes ya tienen 🏗️ y 👥. Al miembro le llega un aviso; quien sale del campamento los pierde. 👔 Encargados también te muestra 👀 lo que espera atención."
