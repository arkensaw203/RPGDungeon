# Texts of the camp's 🔑 permissions by player code, the ⚔️ armory's lock, taking from the 💰 fund and the 📣 announcements
# (D-346, confirmed; how it was applied: D-347, provisional; 0.63).
# [ES] Textos de los 🔑 permisos del campamento (D-346, confirmada por el dueño el 31-oct-2026: "agrega los permisos y que me dé la
# opción a través de un código de darle los permisos a los jugadores"; solo el fundador, con el código del jugador; cuatro, uno
# por uno; cómo se aplicó: D-347, provisional). Se junta con es.yaml al cargar (engine/core/content.py). Lo lee:
# engine/service/permissions.py (👔 Encargados, cada tipo de permiso con la lista de miembros, ⚒️ Oficios, los avisos, la armería, sacar del fondo y el
# 📣 anuncio) y engine/service/gremio.py (👥 Miembros, la tarjeta, 💰 Fondos, ⚔️ Armería, 📢 Chat). Una clave nueva va también en
# en_permisos.yaml (tools/check_locales.py). Si cambias una clave, búscala en el código: una clave que falta se ve como [clave].

