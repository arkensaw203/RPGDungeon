faq:
  d69:
    q: "🔑 How do I give permissions in my camp?"
    a: "Only the founder gives permissions, to the members of their camp: in 🛡️ Guild → 👥 Members → 👔 Managers (only the founder sees it; also /managers) tap a permission type's code (/en1 to /en4) and the list of members comes up: with each one's code (/em1) you give it, and the same code takes it away. There are four: 🏗️ Building (activate works, choose what is built and where the territory grows), ⚒️ Professions (use the 💰 fund for professions with the professions you choose, also while 🔒 closed), ⚔️ Armory and fund (take from the ⚔️ Armory when you close it and take out of the 💰 fund with /fs07 what is left after the works) and 👥 People and chat (accept and invite people and send 📣 announcements, which stay {announce_days} days on top of 🛡️ Guild). Your 🤝 assistants already have 🏗️ and 👥. The member gets a notice; whoever leaves the camp loses them. 👔 Managers also shows you 👀 what needs attention."
